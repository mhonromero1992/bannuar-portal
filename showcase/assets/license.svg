  <rect x="120" y="110" width="1200" height="740" rx="44" fill="#f6f3ec" stroke="#d8cfbf" stroke-width="6"/>
  <rect x="120" y="110" width="1200" height="150" rx="44" fill="#13253d"/>
  <rect x="120" y="200" width="1200" height="60" fill="#13253d"/>
  <text x="720" y="200" text-anchor="middle" font-family="Arial" font-weight="bold" font-size="54" fill="#f2c230" letter-spacing="4">SECURITY GUARD LICENSE</text>
  <rect x="190" y="320" width="300" height="380" rx="20" fill="#cfd6e0"/>
  <circle cx="340" cy="450" r="80" fill="#8b98aa"/><path d="M220 700 C220 580 290 540 340 540 C390 540 460 580 460 700 Z" fill="#8b98aa"/>
  <g font-family="Arial" fill="#0d1a2b">
