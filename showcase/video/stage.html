<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Bannuar showcase</title>
<style>
@font-face { font-family: 'A-Reg'; src: url('assets/Archivo-Regular.ttf'); }
@font-face { font-family: 'A-Semi'; src: url('assets/Archivo-SemiBold.ttf'); }
@font-face { font-family: 'A-Bold'; src: url('assets/Archivo-Bold.ttf'); }
@font-face { font-family: 'A-Wide'; src: url('assets/ArchivoExpanded-Bold.ttf'); }
@font-face { font-family: 'A-Narrow'; src: url('assets/ArchivoCondensed-SemiBold.ttf'); }
:root { --night: #0b1626; --night2: #13253d; --night3: #1b3150; --sun: #f2c230; --red: #c4161c; --on: #eef2f7; --pale: #aebccf; --ground: #f6f3ec; }
html, body { margin: 0; background: #000; }
#stage { position: relative; width: 1920px; height: 1080px; overflow: hidden; background: var(--night); font-family: 'A-Reg', sans-serif; color: var(--on); }
#stage * { box-sizing: border-box; }
.abs { position: absolute; }
#bg { position: absolute; inset: 0; }
.star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff; }

/* captions */
.caption { position: absolute; }
.kicker { font-family: 'A-Narrow', sans-serif; font-size: 19px; letter-spacing: 3px; text-transform: uppercase; color: var(--sun); display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
.kicker::before { content: ''; width: 12px; height: 12px; border-radius: 50%; background: var(--sun); box-shadow: 0 0 18px 4px rgba(242,194,48,.55); }
.ctitle { font-family: 'A-Wide', sans-serif; font-size: 50px; line-height: 1.12; letter-spacing: -0.5px; color: #fff; margin: 0 0 22px; }
.cbody { font-size: 27px; line-height: 1.5; color: #cbd5e1; margin: 0; }
.steps { margin-top: 34px; display: grid; gap: 14px; }
.step { display: flex; align-items: center; gap: 16px; font-family: 'A-Semi', sans-serif; font-size: 24px; color: #8b98aa; }
.step .dot { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #3a4a62; display: flex; align-items: center; justify-content: center; font-size: 18px; color: #8b98aa; flex: none; }
.step.done .dot { background: #1f6f4a; border-color: #1f6f4a; color: #fff; }
.step.done { color: #cbd5e1; }
.step.now .dot { background: var(--sun); border-color: var(--sun); color: var(--night); box-shadow: 0 0 22px 2px rgba(242,194,48,.45); }
.step.now { color: #fff; }

/* devices */
.device { position: absolute; }
.screen { position: absolute; overflow: hidden; background: #fff; }
.layer { position: absolute; left: 0; top: 0; overflow: hidden; }
.content { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.content img { display: block; width: 100%; height: 100%; }
.shade { position: absolute; inset: 0; background: #000; pointer-events: none; }
.overlay { position: absolute; inset: 0; pointer-events: none; }
.ring { position: absolute; border: 3px solid var(--sun); border-radius: 12px; box-shadow: 0 0 0 6px rgba(242,194,48,.22), 0 0 30px rgba(242,194,48,.45); }
.cursor { position: absolute; width: 34px; height: 34px; margin: -3px 0 0 -6px; filter: drop-shadow(0 3px 6px rgba(0,0,0,.45)); }
.ripple { position: absolute; border-radius: 50%; border: 3px solid var(--sun); }
.touch { position: absolute; border-radius: 50%; background: rgba(255,255,255,.38); border: 3px solid rgba(255,255,255,.95); box-shadow: 0 4px 18px rgba(0,0,0,.35); }

.browser { border-radius: 16px; overflow: hidden; box-shadow: 0 40px 120px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08); background: #fff; }
.browser .bar { position: absolute; left: 0; top: 0; right: 0; height: 46px; background: #e8e4dc; display: flex; align-items: center; padding: 0 18px; gap: 9px; border-bottom: 1px solid #d6d0c4; }
.browser .bar i { width: 13px; height: 13px; border-radius: 50%; display: block; }
.browser .url { margin-left: 22px; height: 30px; flex: 1; max-width: 640px; border-radius: 9px; background: #fff; display: flex; align-items: center; gap: 9px; padding: 0 14px; font-family: 'A-Reg'; font-size: 16px; color: #4f5b6b; }
.browser .url b { font-family: 'A-Semi'; color: #0d1a2b; font-weight: normal; }

.phone { border-radius: 64px; background: #0a0c10; box-shadow: 0 40px 120px rgba(0,0,0,.6), inset 0 0 0 2px #2a2f3a, 0 0 0 1px #3a404c; }
.phone .screen { border-radius: 52px; }
.island { position: absolute; background: #000; border-radius: 22px; }
.sbar { position: absolute; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; font-family: 'A-Semi'; }
.homebar { position: absolute; left: 0; right: 0; bottom: 0; }
.homebar i { position: absolute; left: 50%; bottom: 9px; width: 140px; height: 5px; margin-left: -70px; border-radius: 3px; }

.tablet { border-radius: 40px; background: #0a0c10; box-shadow: 0 40px 120px rgba(0,0,0,.55), inset 0 0 0 2px #2a2f3a, 0 0 0 1px #3a404c; }
.tablet .screen { border-radius: 22px; }
.cam { position: absolute; width: 9px; height: 9px; border-radius: 50%; background: #1d2330; box-shadow: inset 0 0 0 2px #2e3644; }

.paper { background: #fff; box-shadow: 0 40px 120px rgba(0,0,0,.6); border-radius: 4px; }

/* cards */
.card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.badge-img { width: 230px; height: 230px; filter: drop-shadow(0 0 40px rgba(242,194,48,.35)); }
.big { font-family: 'A-Wide'; font-size: 82px; letter-spacing: -1px; color: #fff; margin: 34px 0 18px; }
.line { font-size: 34px; color: #cbd5e1; margin: 0; }
.pills { display: flex; gap: 18px; margin-top: 54px; }
.pill { font-family: 'A-Semi'; font-size: 24px; color: #fff; padding: 14px 26px; border-radius: 40px; border: 1.5px solid rgba(242,194,48,.55); background: rgba(19,37,61,.65); display: flex; align-items: center; gap: 12px; }
.pill::before { content: ''; width: 10px; height: 10px; border-radius: 50%; background: var(--sun); }
.chapter-n { width: 112px; height: 112px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'A-Wide'; font-size: 56px; color: var(--night); background: var(--sun); box-shadow: 0 0 60px 10px rgba(242,194,48,.35); }
.small { font-size: 22px; color: #8b98aa; margin-top: 40px; }

#progress { position: absolute; left: 50%; bottom: 30px; width: 1000px; margin-left: -500px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
#progress .seg { font-family: 'A-Narrow'; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: #8b98aa; }
#progress .seg .track { height: 4px; border-radius: 2px; background: rgba(174,188,207,.22); margin-top: 8px; overflow: hidden; }
#progress .seg .fill { height: 100%; background: var(--sun); width: 0; }
#progress .seg.on { color: #fff; }
#tag { position: absolute; right: 40px; top: 30px; font-family: 'A-Narrow'; font-size: 16px; letter-spacing: 2px; text-transform: uppercase; color: #aebccf; border: 1.5px solid rgba(174,188,207,.45); border-radius: 30px; padding: 7px 16px; }
svg.links { position: absolute; inset: 0; overflow: visible; }
</style>
</head>
<body>
<div id="stage"></div>
<script type="module" src="stage.js"></script>
</body>
</html>
